[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sayable"
version = "0.1.0"
description = "Make text sayable for TTS engines (Chatterbox Turbo friendly)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Cash Williams" }]

[project.urls]
Homepage = "https://github.com/CashWilliams/sayable"
Repository = "https://github.com/CashWilliams/sayable"
Issues = "https://github.com/CashWilliams/sayable/issues"

[project.scripts]
sayable = "sayable.cli:main"

[project.optional-dependencies]
dev = ["pytest", "build"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sayable"]
include-package-data = true

[tool.setuptools.data-files]
"share/sayable/data" = ["data/tag_train.csv"]
"share/sayable/models" = ["models/tag_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
