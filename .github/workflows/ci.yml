name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --extra dev pytest
      - name: Validate OpenSpec
        run: |
          npm install -g @fission-ai/openspec
          openspec validate --specs --strict
          changes=$(openspec list --json | python3 -c 'import json, sys; print(" ".join(change["name"] for change in json.load(sys.stdin).get("changes", [])))')
          if [ -n "$changes" ]; then
            for change in $changes; do
              openspec validate "$change" --strict
            done
          else
            echo "No active OpenSpec changes to validate."
          fi
      - name: Build package
        run: uv build
      - name: Install and smoke test package
        run: |
          uv venv smoke-venv
          uv pip install --python smoke-venv/bin/python dist/*.whl
          smoke-venv/bin/sayable --help
